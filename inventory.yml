pis:
  hosts:
    # Run the playbook on the Pi itself
    local:
      ansible_connection: local
      ansible_python_interpreter: /usr/bin/python3
    # Or run it from another machine over SSH
    pilocal:
      ansible_user: bertrand
      ansible_host: localhost
      ansible_port: 2222
      ansible_python_interpreter: /usr/bin/python3
    pijohnny:
      ansible_user: bertrand
      ansible_host: pijohnny
      ansible_python_interpreter: /usr/bin/python3
