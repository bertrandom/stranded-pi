- name: Main
  hosts: pis
  become: true
  vars:
    jc_dir: /opt/jc_reborn
    jc_repo: https://github.com/bertrandom/jc_reborn.git
    jc_version: 2f6836fe73f41ed335b7cb48815d0450b738544d
    jc_resources_url: https://test.bert.org/johnny.zip
    jc_resources_checksum: sha256:4db347c0f57a4d92bad23234cc91034eeef5073d92a79e5ec1e0461f47393980
    jc_user: johnny
    jc_home: /var/lib/johnny
    # Initial jc_reborn settings, only written when not set yet: after that,
    # change them on the web page (http://<pi>/)
    jc_default_settings:
      nightMode: 1
      nightStart: "22:00"
      nightEnd: "08:00"
      cec: 1
    # Set by image/build.sh when installing into a Raspberry Pi OS image
    # instead of a running Pi: nothing can be started, and cloud-init must
    # stay enabled for Raspberry Pi Imager's settings to apply on first boot
    jc_image_build: false

  tasks:
    - name: Install packages
      apt:
        update_cache: true
        cache_valid_time: 3600
        pkg:
          - build-essential
          - git
          - libdrm-dev
          - libsdl2-dev
          - pkgconf
          - polkitd
          - unzip
          - v4l-utils

    - name: Create user to run jc_reborn
      user:
        name: "{{ jc_user }}"
        system: true
        home: "{{ jc_home }}"
        shell: /usr/sbin/nologin
        groups: [video, render, input, audio]

    - name: Clone jc_reborn repository
      git:
        repo: "{{ jc_repo }}"
        dest: "{{ jc_dir }}"
        version: "{{ jc_version }}"
      register: jc_git
      notify: Restart jc_reborn

    - name: Download Johnny Castaway resources
      get_url:
        url: "{{ jc_resources_url }}"
        dest: /var/cache/johnny.zip
        checksum: "{{ jc_resources_checksum }}"

    - name: Extract Johnny Castaway resources
      unarchive:
        src: /var/cache/johnny.zip
        dest: "{{ jc_dir }}"
        remote_src: true
        creates: "{{ jc_dir }}/RESOURCE.MAP"

    # The Makefile doesn't track header dependencies, so rebuild from scratch
    - name: Clean previous jc_reborn build
      community.general.make:
        chdir: "{{ jc_dir }}"
        file: "{{ jc_dir }}/Makefile.linux"
        target: clean
      when: jc_git.changed

    - name: Build jc_reborn
      community.general.make:
        chdir: "{{ jc_dir }}"
        file: "{{ jc_dir }}/Makefile.linux"
      notify: Restart jc_reborn

    - name: Create jc_reborn settings file
      copy:
        dest: "{{ jc_home }}/.jc_reborn"
        content: ""
        force: false
        owner: "{{ jc_user }}"
        group: "{{ jc_user }}"
        mode: '0644'

    - name: Set default jc_reborn settings
      shell: |
        grep -q '^{{ item.key }}=' {{ jc_home }}/.jc_reborn && exit 0
        echo '{{ item.key }}={{ item.value }}' >> {{ jc_home }}/.jc_reborn
        echo added
      loop: "{{ jc_default_settings | dict2items }}"
      register: jc_settings
      changed_when: "'added' in jc_settings.stdout"
      notify: Restart jc_reborn

    # jc_reborn owns tty1, so no login prompt should start there. Not by
    # masking getty@tty1: Raspberry Pi OS's first boot user setup (userconf)
    # enables and starts it, and fails if it's masked
    - name: Unmask login prompt on tty1
      systemd:
        name: getty@tty1.service
        masked: false

    - name: Create getty@tty1 override directory
      file:
        path: /etc/systemd/system/getty@tty1.service.d
        state: directory

    - name: Skip login prompt on tty1 while jc_reborn is installed
      copy:
        dest: /etc/systemd/system/getty@tty1.service.d/jc_reborn.conf
        content: |
          [Unit]
          ConditionPathExists=!/etc/systemd/system/jc_reborn.service

    # For the Reboot and Shut down buttons on the web page: jc_reborn runs
    # systemctl reboot or poweroff, which polkit only allows johnny to run
    # with this rule
    - name: Allow jc_reborn to reboot and shut down
      copy:
        dest: /etc/polkit-1/rules.d/50-jc_reborn.rules
        mode: '0644'
        content: |
          // Lets jc_reborn's web page reboot or shut down the computer
          polkit.addRule(function(action, subject) {
              if (subject.user == "{{ jc_user }}" &&
                  (action.id == "org.freedesktop.login1.reboot" ||
                   action.id == "org.freedesktop.login1.reboot-multiple-sessions" ||
                   action.id == "org.freedesktop.login1.power-off" ||
                   action.id == "org.freedesktop.login1.power-off-multiple-sessions")) {
                  return polkit.Result.YES;
              }
          });

    - name: Install jc_reborn service
      copy:
        src: jc_reborn.service
        dest: /etc/systemd/system/jc_reborn.service
      notify: Restart jc_reborn

    - name: Enable and start jc_reborn
      systemd:
        name: jc_reborn.service
        enabled: true
        state: "{{ omit if jc_image_build else 'started' }}"
        daemon_reload: "{{ not jc_image_build }}"

    # Speed up boot: nothing here needs to wait for the network
    - name: Disable waiting for network at boot
      systemd:
        name: NetworkManager-wait-online.service
        enabled: false

    # cloud-init only matters for the first boot of an rpi-imager image
    - name: Disable cloud-init
      copy:
        dest: /etc/cloud/cloud-init.disabled
        content: ""
      when: not jc_image_build

  handlers:
    - name: Restart jc_reborn
      systemd:
        name: jc_reborn.service
        state: restarted
        daemon_reload: true
      when: not jc_image_build
